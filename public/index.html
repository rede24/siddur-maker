<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=5,viewport-fit=cover,user-scalable=yes">
  <meta name="theme-color" content="#173b32"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="תהילת ה׳">
  <link rel="apple-touch-icon" href="/icons/icon-180.png"><link rel="icon" type="image/png" sizes="32x32" href="/icons/icon-32.png"><link rel="manifest" href="/manifest.webmanifest"><link rel="stylesheet" href="/styles.css?v=39"><title>סידור תהילת ה׳</title>
</head>
<body>
  <main id="home" class="home">
    <div class="ambient ambient-one"></div><div class="ambient ambient-two"></div>
    <header class="brand"><img class="app-emblem" src="/icons/icon-192.png" alt="סמל סידור תהילת ה׳"><div><span class="brand-kicker">סידור תפילה</span><h1>תהילת ה׳</h1><p>נוסח אדמו״ר הזקן</p></div></header>
    <section class="today-card" aria-label="הנחיות תפילה להיום"><div id="hebrew-date" class="hebrew-date"></div><strong id="occasion" class="occasion" hidden></strong><div id="today-guidance" class="today-guidance"></div></section>
    <div class="section-title"><span></span><strong>בחר תפילה</strong><span></span></div>
    <div id="prayer-list" class="prayer-list">
      <section data-card="shacharit" class="prayer-card"><button class="primary" type="button" aria-expanded="false"><span class="prayer-icon">ש</span><span class="prayer-name">תפילת שחרית<small>תפילת הבוקר</small></span><span class="chevron">⌄</span></button><div class="quick-starts shacharit-starts" aria-label="חלוקת שחרית"><p data-service-guidance class="service-guidance"></p><button data-prayer="shacharit" data-start="6">ברכות השחר — מודה אני</button><button data-prayer="shacharit" data-start="12">תפילת השחר — הריני</button><button data-prayer="shacharit" data-start="18">קרבנות</button><button data-prayer="shacharit" data-start="23">איזהו</button><button data-prayer="shacharit" data-start="27">פסוקי דזמרה — הודו</button><button data-prayer="shacharit" data-start="41">ישתבח</button><button data-prayer="shacharit" data-start="45">שמע</button><button data-prayer="shacharit" data-start="50">שמונה עשרה</button><button data-hallel data-prayer="shacharit" data-start="hallel-1">הלל</button><button data-musaf data-prayer="shacharit" data-start="extra-246">מוסף</button><button data-weekday-only data-prayer="shacharit" data-start="63">תחנון וקריאת התורה — שני וחמישי</button><button data-prayer="shacharit" data-start="71">אשרי ובא לציון</button><button data-prayer="shacharit" data-start="daily-song">שיר של יום</button><button data-prayer="shacharit" data-start="81">לדוד</button><button data-prayer="shacharit" data-start="84">עלינו</button><button data-prayer="shacharit" data-start="85">תפילין רבינו תם</button><button data-prayer="shacharit" data-start="86">שש זכירות</button></div></section>
      <section data-card="mincha" class="prayer-card"><button class="primary" type="button" aria-expanded="false"><span class="prayer-icon">מ</span><span class="prayer-name">תפילת מנחה<small>תפילת אחר הצהריים</small></span><span class="chevron">⌄</span></button><div class="quick-starts" aria-label="חלקי תפילת מנחה"><p data-service-guidance class="service-guidance"></p><button data-prayer="mincha" data-start="mincha-korbanot-1">קרבנות</button><button data-prayer="mincha" data-start="96">אשרי</button><button data-tachanun data-prayer="mincha" data-start="103">תחנון</button></div></section>
      <section data-card="maariv" class="prayer-card"><button class="primary" type="button" aria-expanded="false"><span class="prayer-icon">ע</span><span class="prayer-name">תפילת ערבית<small>תפילת הלילה</small></span><span class="chevron">⌄</span></button><div class="quick-starts single-start" aria-label="חלקי תפילת ערבית"><p data-service-guidance class="service-guidance"></p><button data-prayer="maariv" data-start="106">התחלת ערבית</button></div></section>
      <section data-card="birkat" class="prayer-card"><button class="primary" type="button" aria-expanded="false"><span class="prayer-icon">ב</span><span class="prayer-name">ברכת המזון<small>לאחר הסעודה</small></span><span class="chevron">⌄</span></button><div class="quick-starts single-start" aria-label="ברכת המזון"><p data-service-guidance class="service-guidance"></p><button data-prayer="birkat" data-start="88">התחלת ברכת המזון</button></div></section>
    </div>
    <div id="offline-status" class="offline-status" aria-live="polite">מכין את הסידור לשימוש ללא אינטרנט…</div>
  </main>
  <section id="reader" class="reader" hidden><div id="book" class="book" dir="rtl"><div id="flipbook" class="flipbook" aria-label="עמודי הסידור"></div><div id="loading" class="loading">טוען…</div></div></section>
  <script src="/app.js?v=39" type="module"></script>
</body></html>
