<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="theme-color" content="#f3ecdd" />
    <title>סידור</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header>
      <button id="menuButton" class="icon" hidden aria-label="חזרה לתפריט">⌂</button>
      <div>
        <h1 id="title">סידור</h1>
        <p id="subtitle"></p>
      </div>
      <button id="zoomButton" class="icon" hidden aria-label="שינוי גודל">א+</button>
    </header>
    <main>
      <section id="menu" aria-label="בחירת תפילה"></section>
      <section id="reader" hidden aria-live="polite">
        <button id="previous" class="nav previous" aria-label="העמוד הקודם">›</button>
        <div id="pageFrame"><img id="page" alt="עמוד בסידור" /></div>
        <button id="next" class="nav next" aria-label="העמוד הבא">‹</button>
      </section>
    </main>
    <footer id="status"></footer>
    <script src="app.js" defer></script>
  </body>
</html>
